{% extends 'base.html' %}
{% block title %}{{ super() }} - Edit User{% endblock %}

{% block content %}
<div class="container">
    <h2>Edit User</h2>

    <form action="{{ url_for('edit_user', user_id=user.id) }}" method="post">
        <table class="table table-condensed">
            <tr>
                <td><label for="email">Email</label></td>
                <td><input class="form-control" type="email" id="email"
                           name="email" value="{{ user.email }}" required /></td>
            </tr>
            <tr>
                <td><label for="name">Name</label></td>
                <td><input class="form-control" type="text" id="name"
                           name="name" value="{{ user.name }}" /></td>
            </tr>
            <tr>
                <td><label for="new_password">New Password</label></td>
                <td>
                    <input class="form-control" type="password"
                           id="new_password" name="new_password" />
                    <p class="help-block">Leave blank to keep the current password.</p>
                </td>
            </tr>
            <tr>
                <td><label for="is_admin">Administrator</label></td>
                <td><input type="checkbox" id="is_admin" name="is_admin"
                           value="1" {% if user.is_admin %}checked{% endif %} /></td>
            </tr>
        </table>
        <input class="btn btn-default" type="submit" value="Save" />
        <a class="btn btn-link" href="{{ url_for('list_users') }}">Cancel</a>
    </form>
</div>
{% endblock %}
