{% extends 'base.html' %}
{% block title %}{{ super() }} - Account{% endblock %}

{% block content %}
<div class="container">
    <h2>Account</h2>

    <form action="{{ url_for('account') }}" method="post">
        <table class="table table-condensed">
            <tr>
                <td><label>Email</label></td>
                <td class="form-control-static">{{ user.email }}</td>
            </tr>
            <tr>
                <td><label for="name">Name</label></td>
                <td><input class="form-control" type="text" id="name"
                           name="name" value="{{ user.name }}" /></td>
            </tr>
            <tr>
                <td><label for="current_password">Current Password</label></td>
                <td>
                    <input class="form-control" type="password"
                           id="current_password" name="current_password" />
                    <p class="help-block">Required in order to change the password.</p>
                </td>
            </tr>
            <tr>
                <td><label for="new_password">New Password</label></td>
                <td>
                    <input class="form-control" type="password"
                           id="new_password" name="new_password" />
                    <p class="help-block">Leave blank to keep the current password.</p>
                </td>
            </tr>
        </table>
        <input class="btn btn-default" type="submit" value="Save" />
    </form>
</div>
{% endblock %}
